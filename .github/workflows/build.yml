name: Build Windows App
 
on:
  workflow_dispatch:
  push:
    branches: [ main ]
 
jobs:
  build:
    runs-on: windows-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
 
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
 
      - name: Install PyTorch (CPU version)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
 
      - name: Install app dependencies
        run: pip install -r requirements.txt
 
      - name: Install PyInstaller
        run: pip install pyinstaller
 
      - name: Download FFmpeg (portable, to bundle into the app)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination "ffmpeg.exe"
          if (-not (Test-Path "ffmpeg.exe")) { throw "Khong tim thay ffmpeg.exe sau khi giai nen" }
          Write-Host "Da tai va giai nen ffmpeg.exe thanh cong"
 
      - name: Build .exe (with FFmpeg bundled inside)
        run: pyinstaller --onefile --windowed --collect-all torch --collect-all transkun --collect-all setuptools --collect-all psutil --add-binary "ffmpeg.exe;." --name "PianoTranscriber" app.py
 
      - name: Upload built app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PianoTranscriber-Windows
          path: dist/PianoTranscriber.exe
